name: CI/CD MLflow Advance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Environment check passed!"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mlflow==2.19.0 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 imbalanced-learn==0.12.4 matplotlib==3.9.2 seaborn==0.13.2 pyarrow==18.1.0 cloudpickle==3.1.2 psutil==7.0.0 scipy==1.14.1 google-auth==2.35.0 google-auth-oauthlib==1.2.1 google-auth-httplib2==0.2.0 google-api-python-client==2.149.0

      - name: Run mlflow project
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > finalsubmission-intermediate-2317477c14a0.json
          mlflow run MLProject --env-manager=local --experiment-name "Loan_Approval"

      - name: Get latest MLflow run_id
        run: |
          echo "=== Debug: struktur mlruns ==="
          find mlruns -maxdepth 4 -type d | head -30
          echo "=============================="
          MODEL_PATH=$(find mlruns -type d -path "*/artifacts/model" | head -n 1)
          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          echo "MODEL_PATH: $MODEL_PATH"
          ls -la "$MODEL_PATH" || { echo "ERROR: model tidak ditemukan!"; exit 1; }
          RUN_ID=$(echo "$MODEL_PATH" | cut -d'/' -f3)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "RUN_ID: $RUN_ID"

      - name: Install Python dependencies
        run: |
          python -m pip install google-auth==2.35.0 google-auth-oauthlib==1.2.1 google-auth-httplib2==0.2.0 google-api-python-client==2.149.0

      - name: Upload to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          python MLProject/upload_to_gdrive.py

      - name: Build Docker Model
        run: |
          docker build --build-arg MODEL_PATH="${{ env.MODEL_PATH }}" -t ${{ secrets.DOCKER_HUB_USERNAME }}/loan-approval-model:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/loan-approval-model:latest ${{ secrets.DOCKER_HUB_USERNAME }}/loan-approval-model:${{ env.RUN_ID }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/loan-approval-model:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/loan-approval-model:${{ env.RUN_ID }}
